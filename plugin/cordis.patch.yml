# Applied by DSH when this plugin is bundled into a profile.
#
# THIS PATCH REGISTERS THE PLUGIN ONLY. It adds, removes and modifies no LLM provider,
# no model and no API key -- provider configuration is yours to own.
#
# With no config block the plugin uses its built-in defaults (localProvider lm-studio,
# localModel qwen/qwen3.8-27b, cloudProvider deepseek-official, cloudModel deepseek-chat).
# Override them in your own profile patch; cordis.patch.example.yml has a complete
# worked example, and README.md "Configuring providers" covers other endpoints and
# cloud-only setups.
- insert:
    - id: local-router
      name: 'dsh-plugin-coding-delegate'
