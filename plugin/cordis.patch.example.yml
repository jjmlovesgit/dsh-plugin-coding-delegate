# EXAMPLE ONLY - NOT APPLIED AUTOMATICALLY.
#
# These entries DO modify provider configuration, which is exactly why they are not shipped
# as an automatic patch. Copy what you need into your DSH profile
# (profiles/<name>/cordis.patch.yml) or into ~/.dsh/settings.yaml.
#
# This is Option 1 from README.md, "Configuring providers": a local LM Studio worker plus
# DeepSeek Cloud. For any other OpenAI-compatible endpoint (vLLM, Ollama, llama.cpp, a
# remote gateway, ...) change baseURL and the model id, then point the plugin's
# localProvider / localModel at it.

# The plugin itself. Delete this whole block to accept the built-in defaults listed in
# cordis.patch.yml.
- id: local-router
  config:
    localProvider: 'lm-studio'
    localModel: 'qwen/qwen3.8-27b'
    cloudProvider: 'deepseek-official'
    cloudModel: 'deepseek-chat'
    # guardAskPaths REPLACES the built-in default rather than extending it, so list every
    # path that should stay approval-eligible instead of hard-denied.
    guardAskPaths:
      - 'tests/'
      - 'tools/'
    # A tripped DLP firewall reroutes to the local worker rather than refusing the request.
    dlpAction: 'local'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      lm-studio:
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        apiKeyEnv: LM_STUDIO_API_KEY
        models:
          - id: qwen/qwen3.8-27b
            name: 'Qwen 3.8 27B Local'
            maxTokens: 16384

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
