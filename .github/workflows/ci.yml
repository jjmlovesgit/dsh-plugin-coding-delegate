name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows, not Linux: the plugin is built for a Windows host with LM Studio, and its
    # guard branches on process.platform for path containment.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Committed dist matches a clean build
        # DSH loads dist/index.js, so a stale dist ships stale behaviour -- which caused real
        # confusion during development. tsc is deterministic for a pinned version.
        run: git diff --exit-code -- dist

      - name: Unit tests
        run: npm test

      - name: Regression oracles
        # Exercises the guard, DLP gate, redaction, containment and verification paths against
        # the built artefact.
        run: npm run test:oracles

      - name: Promotion socket oracle
        # Separate from the suite above because the file is `.mjs`, not `.test.cjs`. It tests
        # scripts/check-promotion.cjs, which the write guard refuses to a cloud context for ending in
        # `.cjs` -- so the oracle exists under an extension the guard does not classify as source. The
        # glob in `test:oracles` therefore does not reach it, and running it here is what stops that
        # from meaning it never runs at all.
        #
        # It is also the only test that would CATCH a silent socket bug: a missing verdict branch falls
        # through to a generic refusal and exits 1, which is indistinguishable from correct strictness.
        working-directory: .
        run: node --test plugin/tests/oracles/promotion-socket.oracle.mjs

      - name: Attestation identity oracle
        # Also `.mjs`, and also outside the `test:oracles` glob. It asserts the one property no end-to-end
        # check could: a live probe recorded a session UUID as the operator, and every command in the chain
        # passed, because the record LOOKED like human sign-off. Only asking "who does this actually name"
        # catches that, which is why the assertion is on the recorded value rather than on whether it worked.
        working-directory: .
        run: node --test plugin/tests/oracles/attestation-identity.oracle.mjs

      - name: Tool surface oracle
        # Guards the schema duplication that already cost a false test: `attestTargets` was added to the
        # inline copy in index.ts and not to the canonical export, so the parameter was silently stripped
        # from every call while the tool reported success. The duplication is now removed, and this asserts
        # the property that makes the removal safe -- that there is ONE object, not two that agree today.
        working-directory: .
        run: node --test plugin/tests/oracles/tool-surface.oracle.mjs

      - name: README consistency
        # The repository-root scripts never ran in CI: this job's default working-directory is `plugin`,
        # so everything under `scripts/` was local-only. That is how the two READMEs drifted to seven
        # policy rules against eight without anything noticing, and why the check written to catch it
        # would only ever have run if someone remembered to. Overridden per step rather than by moving
        # the job, because the scripts resolve the repository root from their own location, not the cwd.
        working-directory: .
        run: node scripts/check-readme-consistency.cjs

      - name: Contract well-formedness
        # check-contract.cjs judges a contract against a NULL implementation -- does it reach its
        # assertions, does it malfunction -- and takes one contract at a time. This walks the directory
        # and pairs each contract with the module of the same name, which is the convention both
        # contracts follow. The exit code is checked after EVERY run on purpose: GitHub's pwsh wrapper
        # only inspects the last native command's status, so a bare sequence would let an earlier
        # failure pass unnoticed.
        working-directory: .
        shell: pwsh
        run: |
          foreach ($c in Get-ChildItem tests/contracts/*.contract.cjs) {
            $base = $c.BaseName -replace '\.contract$', ''
            Write-Host "checking $($c.Name) against tools/$base.ts"
            node scripts/check-contract.cjs --contract $c.FullName --module "tools/$base.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Contract discriminative power (negative fixtures)
        # The half check-contract.cjs cannot test. A null stub is not a plausible WRONG answer, so it
        # cannot tell whether a case exercises the property its name claims: measured, a contract
        # containing only the vacuous non-mutating corruption case is reported by check-contract.cjs as
        # "well-formed and discriminating". This step requires every contract to PASS its own module and
        # FAIL a fixture that is deliberately correct in every respect except one, and it fails closed
        # when a fixture is missing rather than skipping, because a gate that passes when its fixtures
        # are absent provides no guarantee at all.
        working-directory: .
        run: node scripts/check-contract-fixtures.cjs

      - name: Delegation ledger audit
        # Walks refs/notes/delegations and checks four things per note: the Ed25519 signature against a
        # PINNED operator key, that baseCommit is an ancestor of main, that every artifact still matches
        # the bytes on disk, and that contractHash recomputes.
        #
        # The pin is what makes this attribution rather than self-consistency. `verifyEnvelope` verifies
        # against the key EMBEDDED IN THE ENVELOPE, so an attacker who replaces the payload can replace
        # the key beside it and the envelope still verifies. Measured against a note re-signed with a
        # throwaway key: it passes its own check and fails this one.
        #
        # THE PINNED PUBLIC KEY IS COMMITTED at keys/delegation-operator.pub. A runner has no ~/.dsh, so
        # a resolver that read only the operator's key directory would fail this step on every run --
        # permanently red, and so ignored. The public key is not a secret, and committing it is what lets
        # CI attribute records without holding one. The script still cross-checks every key source that
        # IS present locally and fails if they disagree.
        #
        # contractHash is recomputed by convention where the contract set is recoverable, and reported
        # UNVERIFIABLE where it is not: the envelope records only the digest, never the {path, sha256}
        # array it was taken over, so one legacy note cannot be reconstructed. That is a schema gap, and
        # failing the build for it would bury real tampering behind an unrecoverable input.
        working-directory: .
        run: node scripts/verify-delegation-ledger.cjs
