name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows, not Linux: the plugin is built for a Windows host with LM Studio, and its
    # guard branches on process.platform for path containment.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history is REQUIRED by the ledger audit: it checks that each note's anchor is an
          # ancestor of main and reads each artifact out of THAT commit's tree. The default depth-1
          # checkout has neither, so every note fails with "Not a valid commit name" -- measured in a
          # depth-1 clone, not assumed. This was invisible for as long as an empty ledger made the audit
          # exit early, which is why it is being fixed in the same change that stopped it exiting early.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            package-lock.json

      - run: npm ci

      - name: Install the repository toolchain
        # NOT REDUNDANT, AND NOT COVERED BY THE STEP ABOVE. This job's default working-directory is
        # `plugin`, so the `npm ci` above installs only the plugin's dependencies. The root
        # devDependencies (eslint, dependency-cruiser, typescript) are what `npm run gate`'s
        # architecture stage calls, and without them that stage fails with `depcruise: not found` --
        # measured on run 217, which died two seconds into the gate step having passed hygiene.
        # The gate is a root script, so it needs the root install.
        working-directory: .
        run: npm ci

      - name: Build
        run: npm run build

      - name: Committed dist matches a clean build
        # DSH loads dist/index.js, so a stale dist ships stale behaviour -- which caused real
        # confusion during development. tsc is deterministic for a pinned version.
        run: git diff --exit-code -- dist

      - name: Unit tests
        run: npm test

      - name: Tier 2 engine loopback suite
        # Outside `npm run gate` on purpose, beside the plugin unit tests and the oracles: the gate is
        # the attestation gate, and Tier 2 has no attestation obligation (POL §2 gives it loopback
        # suites). Folding it in would also change the gate's published seven-command accounting for a
        # suite that needs no keys, no worker and no network.
        working-directory: .
        run: npm run test:engine

      - name: Tier 3 route adapter loopback suite
        # The first real Tier 3 file. Outside the gate for the same reason as the engine suite, but
        # note what it DOES exercise inside the gate: eslint's complexity and 40-line ceilings run on
        # `src/routes/**` through `npm run gate:arch`, so this tree is bounded whether or not the
        # tests run.
        working-directory: .
        run: npm run test:routes

      - name: Canonicalizer parity oracle
        # Two implementations of RFC 8785 exist: the authority in plugin/src and the copy embedded in
        # the bundle verifier, which may carry no dependencies. They must produce identical bytes for
        # the same value or every reviewer signature fails at a release, so this compares outputs over
        # a corpus covering every branch -- a text comparison could not, since one is TypeScript and
        # the other is plain JavaScript inside a template literal.
        working-directory: .
        run: npm run test:parity

      - name: Tier 1 core primitive suite
        # The first file under src/core/primitives. Its leaf invariant is enforced by the architecture
        # stage (`npm run gate:arch`), not here; this step proves the behaviour.
        working-directory: .
        run: npm run test:primitives

      - name: Regression oracles
        # Exercises the guard, DLP gate, redaction, containment and verification paths against
        # the built artefact.
        run: npm run test:oracles

      - name: Promotion socket oracle
        # Separate from the suite above because the file is `.mjs`, not `.test.cjs`. It tests
        # scripts/check-promotion.cjs, which the write guard refuses to a cloud context for ending in
        # `.cjs` -- so the oracle exists under an extension the guard does not classify as source. The
        # glob in `test:oracles` therefore does not reach it, and running it here is what stops that
        # from meaning it never runs at all.
        #
        # It is also the only test that would CATCH a silent socket bug: a missing verdict branch falls
        # through to a generic refusal and exits 1, which is indistinguishable from correct strictness.
        working-directory: .
        run: node --test plugin/tests/oracles/promotion-socket.oracle.mjs

      - name: Attestation identity oracle
        # Also `.mjs`, and also outside the `test:oracles` glob. It asserts the one property no end-to-end
        # check could: a live probe recorded a session UUID as the operator, and every command in the chain
        # passed, because the record LOOKED like human sign-off. Only asking "who does this actually name"
        # catches that, which is why the assertion is on the recorded value rather than on whether it worked.
        working-directory: .
        run: node --test plugin/tests/oracles/attestation-identity.oracle.mjs

      - name: Tool surface oracle
        # Guards the schema duplication that already cost a false test: `attestTargets` was added to the
        # inline copy in index.ts and not to the canonical export, so the parameter was silently stripped
        # from every call while the tool reported success. The duplication is now removed, and this asserts
        # the property that makes the removal safe -- that there is ONE object, not two that agree today.
        working-directory: .
        run: node --test plugin/tests/oracles/tool-surface.oracle.mjs

      - name: README consistency
        # The repository-root scripts never ran in CI: this job's default working-directory is `plugin`,
        # so everything under `scripts/` was local-only. That is how the two READMEs drifted to seven
        # policy rules against eight without anything noticing, and why the check written to catch it
        # would only ever have run if someone remembered to. Overridden per step rather than by moving
        # the job, because the scripts resolve the repository root from their own location, not the cwd.
        working-directory: .
        run: node scripts/check-readme-consistency.cjs

      - name: Fetch the delegation ledger
        # `actions/checkout` fetches refs/heads and tags, and never notes. Without this step the ledger
        # is empty in CI, and the audit now treats an empty ledger as a FAILURE rather than a warning,
        # because an empty ledger and a deleted one are indistinguishable. Note what this means for the
        # previous configuration: every gate run in CI audited zero records and reported success, so the
        # attestation check has never actually run here. This step is what makes it run.
        working-directory: .
        run: git fetch origin 'refs/notes/delegations:refs/notes/delegations'

      - name: Run full attestation & verification gate
        # The three gates, called exactly the way a developer calls them locally. What this replaces was
        # an inline PowerShell loop that duplicated scripts/check-contracts.cjs, and the duplication had
        # already drifted in two ways: the loop hardcoded a `pwsh` shell, and it lacked the safeguards
        # the script enforces -- a contract with no matching module is a FAILURE rather than a skip, and
        # a null exit status is reported as a spawn failure rather than as a verdict on the contract.
        # One rule with two implementations is how this repository's README rule-counts diverged once
        # already, which is why the step below is a call rather than a copy.
        #
        # `working-directory: .` is required and not decorative: this job defaults to `plugin`, and
        # plugin/package.json has no `gate` script.
        working-directory: .
        run: npm run gate
