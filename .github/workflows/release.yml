name: Release

# Tag-triggered, and deliberately NOT a prepublish hook.
#
# WHY NOT `prepublishOnly`. The root manifest is `private: true` and is never published, so a
# prepublish script there can never run for a real publish. The published artefact is `plugin/`, and
# it ships only `dist/` -- no Tier 1 primitive is ever packaged -- so a check asserting "every
# bundled primitive has a ledger entry" would be true by construction and could never fail. A gate
# that cannot fail is an administrative illusion; this workflow replaces it with checks that can.
#
# WHAT A TAG BUYS THAT A PUSH DOES NOT. The push-time CI runs the structural gate on every commit.
# A release additionally asserts, at the exact tagged tree, that all nine Tier 1 contracts are
# STABLE across three clean subprocess runs each (27 runs), and publishes both evidence populations
# as release assets with a checksum file. Anyone holding the release can recompute the hashes and
# re-run the audit against the tag.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the ledger audit proves each note's anchor is an ancestor of main and reads
          # artifacts out of that commit's tree. A depth-1 checkout fails every note.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            package-lock.json

      - name: Verify the tag matches the manifests
        # BEFORE ANY INSTALL, because this is the cheapest possible failure and the most expensive
        # one to discover late. A tag that disagrees with the codebase publishes a release whose
        # evidence names a version the artefact does not carry -- and the evidence would look
        # impeccable while doing it. Both manifests are checked: the published package is plugin/,
        # while the gate and its tooling live at the root.
        working-directory: .
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./plugin/package.json').version")"
          echo "tag:    ${TAG_VERSION}"
          echo "root:   ${ROOT_VERSION}"
          echo "plugin: ${PLUGIN_VERSION}"
          # A PRE-RELEASE OF THE SAME BASE VERSION IS LEGITIMATE; anything else must match exactly.
          # Measured: comparing the full strings made every release candidate untaggable -- v0.5.8-rc.2
          # against manifests at 0.5.8 failed the guard before any check ran, which is why the guard
          # shipped without ever being exercised on a candidate.
          matches() {
            case "$1" in
              "$2" | "$2"-*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if ! matches "${TAG_VERSION}" "${ROOT_VERSION}" || ! matches "${TAG_VERSION}" "${PLUGIN_VERSION}"; then
            echo "FATAL: tag ${TAG_VERSION} disagrees with root ${ROOT_VERSION} / plugin ${PLUGIN_VERSION}"
            exit 1
          fi

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Install the repository toolchain
        # The gate's architecture stage calls depcruise and eslint, which live in the ROOT
        # devDependencies. The `npm ci` above runs in plugin/ and installs neither.
        working-directory: .
        run: npm ci

      - name: Fetch the delegation ledger
        working-directory: .
        run: git fetch origin 'refs/notes/delegations:refs/notes/delegations'

      - name: Materialise main for the ledger ancestry check
        # THE TAG CHECKOUT IS DETACHED, AND THE AUDIT NAMES `main` LITERALLY. It asserts every note's
        # baseCommit with `git merge-base --is-ancestor <baseCommit> main`, and on a tag ref there is
        # only `refs/remotes/origin/main` -- so the check fails with "fatal: Not a valid object name
        # main" and takes the whole gate with it. Measured in release run 39184720880 (step 7, 26 s)
        # and reproduced in a tag-only clone: absent with no local main, passing once it exists.
        # This creates the ref the audit names; it does not change what is checked out or tested.
        working-directory: .
        run: git update-ref refs/heads/main refs/remotes/origin/main

      - name: Structural and coverage gate
        working-directory: .
        run: npm run gate

      - name: Flake sweep (contracts x 3 runs)
        # Not part of the every-commit gate: 30 subprocesses on every commit tempts `--no-verify`.
        # A release is the right cadence. `--out` is explicit because the sweep now prints by default:
        # an evidence file is a release product, and writing it from the inner loop dirtied the tree.
        working-directory: .
        run: npm run gate:flake -- --out docs/compliance/evidence/flake-gate-sweep.txt

      - name: Regenerate the ledger evidence at the tag
        # The committed copy records whatever commit it was generated at, so it is stale by
        # definition at release time. Regenerate it here rather than shipping the old one.
        working-directory: .
        shell: bash
        run: |
          {
            echo "# Delegation ledger audit - evidence population"
            echo "#"
            echo "# Generated : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Commit    : $(git rev-parse HEAD)"
            echo "# Tag       : ${GITHUB_REF_NAME}"
            echo "# Command   : node scripts/verify-delegation-ledger.cjs 2>&1"
            echo "#"
            echo ""
          } > docs/compliance/evidence/ledger-audit-population.txt
          node scripts/verify-delegation-ledger.cjs >> docs/compliance/evidence/ledger-audit-population.txt 2>&1

      - name: Checksum the evidence
        working-directory: docs/compliance/evidence
        shell: bash
        run: |
          sha256sum ledger-audit-population.txt flake-gate-sweep.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build and checksum the attested tools bundle
        # The fourth asset, and the only one a consumer can actually use offline: the ten primitives
        # with their contracts, mutants and signed notes, plus a verifier that needs no network, no
        # git and no npm. Its digest joins the same SHA256SUMS.txt as the other evidence, so one file
        # covers all four assets.
        working-directory: .
        shell: bash
        run: |
          npm run export:tools -- --out "dist/attested-tools-${GITHUB_REF_NAME}" --tar
          cp "dist/attested-tools-${GITHUB_REF_NAME}.tar.gz" dist/attested-tools-bundle.tar.gz
          (cd dist && sha256sum attested-tools-bundle.tar.gz) >> docs/compliance/evidence/SHA256SUMS.txt
          cat docs/compliance/evidence/SHA256SUMS.txt

      - name: Attach evidence to the release
        # `gh` is preinstalled on the runner, so this needs no third-party action. The `||` covers a
        # re-run against an existing release, where create fails and upload --clobber replaces the
        # assets; either way the step's exit status is the upload's.
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag carrying a suffix is a candidate, and a candidate must never present itself as the
          # latest release. Without this, publishing v0.5.9-rc.1 made GitHub show a release candidate
          # as `latest` for as long as it existed -- measured on that exact tag.
          PRERELEASE_FLAG=""
          case "${GITHUB_REF_NAME}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # A RELEASE BODY IS WRITTEN, NOT GENERATED. `--generate-notes` alone lists commits, and the one
          # thing an operator must read -- that every `node --test` verification command now fails -- is
          # not a commit title. When a notes file exists for this tag it is prepended to the generated
          # changelog, so the breaking change leads and the commit list follows.
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}-notes.md"
          # A candidate tag uses the notes of the release it precedes: v0.5.11-rc.1 reads
          # v0.5.11-notes.md, so the breaking change is announced on the candidate too, not only on the
          # final cut.
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="docs/releases/${GITHUB_REF_NAME%-*}-notes.md"
          fi
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes "$(cat "$NOTES_FILE")")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${NOTES_ARGS[@]}" \
            ${PRERELEASE_FLAG} \
            docs/compliance/evidence/ledger-audit-population.txt \
            docs/compliance/evidence/flake-gate-sweep.txt \
            docs/compliance/evidence/SHA256SUMS.txt \
            dist/attested-tools-bundle.tar.gz \
          || gh release upload "${GITHUB_REF_NAME}" \
            docs/compliance/evidence/ledger-audit-population.txt \
            docs/compliance/evidence/flake-gate-sweep.txt \
            docs/compliance/evidence/SHA256SUMS.txt \
            dist/attested-tools-bundle.tar.gz --clobber
